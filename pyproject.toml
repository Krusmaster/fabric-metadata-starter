[project]
name = "fabric-metadata-starter"
version = "0.1.0"
description = "Minimal metadata model + generator for metadata-driven Microsoft Fabric pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
dependencies = ["pyyaml>=6"]
keywords = ["microsoft-fabric", "metadata-driven", "data-platform", "medallion"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
fabric-metadata-starter = "fabric_metadata_starter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric_metadata_starter*"]

[tool.setuptools.package-data]
fabric_metadata_starter = ["templates/*.tpl"]
